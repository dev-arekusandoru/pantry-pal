<!doctype html>
<html lang="en" data-design="glaze">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PantryPal, Glaze</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF3E0; --card:#FFFFFF; --ink:#3B2218; --muted:#8C6C5B; --line:#F1DDC4;
  --tomato:#EE5A3D; --tomato-d:#C93F25; --butter:#FFD14A; --butter-s:#FFEDB0; --pistachio:#AEDC7C; --pistachio-s:#DDF2C3;
  --blue:#6E7BF6; --blue-s:#DCE0FF; --gum:#FF9DC8; --gum-s:#FFD9EA; --peach:#FFB48B; --peach-s:#FFE0CD;
  --tab:var(--butter); --tab-s:var(--butter-s);
  --font:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --shadow:0 2px 0 rgba(59,34,24,.06),0 10px 24px -10px rgba(120,60,20,.28);
  --pop:cubic-bezier(.3,1.6,.5,1); --ease:cubic-bezier(.2,.8,.2,1);
  --nav-h:76px; --on-tab:#3B2218; --cook-bg:var(--butter); --cook-ink:#3B2218; color-scheme:light;
}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E120D; --card:#2E1C14; --ink:#FFEBD6; --muted:#C3A491; --line:#4B3226;
  --tomato:#F26645; --tomato-d:#B9402A; --butter:#F4C03A; --butter-s:#58451A; --pistachio:#93C95E; --pistachio-s:#31481F;
  --blue:#7F8BFF; --blue-s:#323872; --gum:#F58BBC; --gum-s:#5C2B42; --peach:#FFB48B; --peach-s:#5A3523;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 12px 26px -10px rgba(0,0,0,.6); --cook-bg:#1E120D; --cook-ink:#FFEBD6; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1E120D; --card:#2E1C14; --ink:#FFEBD6; --muted:#C3A491; --line:#4B3226;
  --tomato:#F26645; --tomato-d:#B9402A; --butter:#F4C03A; --butter-s:#58451A; --pistachio:#93C95E; --pistachio-s:#31481F;
  --blue:#7F8BFF; --blue-s:#323872; --gum:#F58BBC; --gum-s:#5C2B42; --peach:#FFB48B; --peach-s:#5A3523;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 12px 26px -10px rgba(0,0,0,.6); --cook-bg:#1E120D; --cook-ink:#FFEBD6; color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--font);font-variation-settings:"wdth" 94;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button{font:inherit;font-variation-settings:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
ul,ol{list-style:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:14px}
.ic{display:inline-flex;width:1.1em;height:1.1em;flex:none}
.ic svg,.tab-ico svg,.icon-btn svg,.step svg,.btn svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.sep{display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.4;margin:0 .2em}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;font-variation-settings:"wdth" 86}

/* ---------- shell + floating nav ---------- */
.shell{min-height:100dvh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px)}
.nav{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));height:var(--nav-h);background:var(--card);border-radius:34px;box-shadow:var(--shadow),0 0 0 2px var(--line);display:flex;padding:8px}
.brand{display:none}
.tabs{display:flex;flex:1;gap:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:26px;font-size:12px;font-weight:700;color:var(--muted);transition:background .25s var(--ease),color .25s,transform .25s var(--pop)}
.tab-ico{width:26px;height:26px}
.tab[data-tab=week].on{background:var(--butter)}.tab[data-tab=shop].on{background:var(--pistachio)}.tab[data-tab=pantry].on{background:var(--gum)}.tab[data-tab=recipes].on{background:var(--blue);color:#fff}
.tab.on{color:var(--on-tab);transform:translateY(-1px)}.tab[data-tab=recipes].on{color:#fff}

main{padding:16px 16px 24px;max-width:760px;margin:0 auto}
[data-screen=week]{--tab:var(--butter);--tab-s:var(--butter-s)}
[data-screen=shop]{--tab:var(--pistachio);--tab-s:var(--pistachio-s)}
[data-screen=pantry]{--tab:var(--gum);--tab-s:var(--gum-s)}
[data-screen=recipes]{--tab:var(--blue);--tab-s:var(--blue-s)}

/* the memorable bit: a glazed header block with a die-cut sticker */
.page-head{color:var(--on-tab);position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;background:var(--tab);border-radius:34px;padding:26px 24px 22px;margin-bottom:20px;min-height:148px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.07),inset 0 4px 0 rgba(255,255,255,.4);overflow:hidden}
.page-head>div{position:relative;z-index:1}
.page-head::after{position:absolute;right:-6px;top:-12px;font-size:96px;line-height:1;transform:rotate(12deg);filter:drop-shadow(0 6px 0 rgba(255,255,255,.55)) drop-shadow(0 8px 10px rgba(80,30,0,.2));content:"🍳"}
[data-screen=shop] .page-head::after{content:"🧺"}[data-screen=pantry] .page-head::after{content:"🫙"}[data-screen=recipes] .page-head::after{content:"📖"}
[data-screen=recipes] .page-head{color:#fff}[data-screen=recipes] .sub{color:rgba(255,255,255,.86)}
h1{font-size:clamp(40px,11vw,60px);line-height:.92;font-weight:800}
.sub{margin-top:8px;font-size:15px;font-weight:600;opacity:.75}
.page-head .count,.page-head .round-add{position:relative;z-index:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;background:var(--card);font-weight:700;font-size:16px;box-shadow:0 0 0 2px var(--line),0 4px 0 var(--line);transition:transform .15s var(--pop),box-shadow .15s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 2px var(--line),0 1px 0 var(--line)}
.btn .ic{width:19px;height:19px}
.btn.primary{background:var(--tomato);color:#fff;box-shadow:0 4px 0 var(--tomato-d)}
.btn.primary:active{box-shadow:0 1px 0 var(--tomato-d)}
.btn.big{height:60px;font-size:19px;padding:0 30px}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon-btn{color:var(--ink);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.icon-btn svg{width:24px;height:24px}
.round-add{height:48px;padding:0 20px;box-shadow:0 4px 0 var(--tomato-d)}

/* ---------- plates ---------- */
.plate{position:relative;overflow:hidden;aspect-ratio:4/3;border-radius:28px;background:radial-gradient(circle at 30% 25%,hsl(var(--h) 80% 86%),hsl(var(--h) 70% 74%));display:grid;place-items:center}
.plate-em{font-size:clamp(52px,14vw,88px);filter:drop-shadow(0 6px 0 rgba(255,255,255,.5))}
.plate img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ---------- week ---------- */
.tonight{background:var(--card);border-radius:34px;padding:10px 10px 22px;box-shadow:var(--shadow);display:grid;gap:16px;margin-bottom:14px}
.tonight-plate{aspect-ratio:16/10;border-radius:26px}
.tonight-body{padding:0 12px}
.tonight-kicker{display:inline-block;background:var(--tomato);color:#fff;font-weight:700;font-size:13.5px;padding:3px 12px;border-radius:999px;transform:rotate(-2deg);margin-bottom:10px}
.tonight h2{font-size:clamp(30px,8vw,40px);line-height:1;margin-bottom:10px}
.tonight-meta{display:flex;align-items:center;gap:7px;font-size:14.5px;color:var(--muted);flex-wrap:wrap;margin-bottom:16px;font-weight:600}
.tonight-meta .ic{width:17px;height:17px;margin-left:6px}.tonight-meta .ic:first-child{margin-left:0}
.tonight-actions{display:flex;gap:10px;flex-wrap:wrap}
.nudge{display:flex;gap:12px;align-items:center;background:var(--peach-s);border-radius:24px;padding:14px 18px;margin-bottom:22px;font-size:15px;font-weight:600}
.nudge .ic{width:26px;height:26px;color:var(--tomato)}
.days{display:grid;gap:14px}
.day{background:var(--card);border-radius:28px;padding:14px 16px 10px;box-shadow:var(--shadow)}
.day.is-today{box-shadow:0 0 0 3px var(--butter),var(--shadow)}
.day-name{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.d-short{font-size:26px;font-weight:800;font-variation-settings:"wdth" 80}
.d-date{font-size:14px;color:var(--muted);font-weight:600}
.today-flag{margin-left:auto;background:var(--butter);padding:2px 12px;border-radius:999px;font-size:13px;font-weight:800;transform:rotate(3deg)}
.slot-btn{display:flex;gap:12px;align-items:center;width:100%;padding:8px 0;border-top:2px dashed var(--line)}
.slots li:first-child .slot-btn{border-top:0}
.slot-em{font-size:26px;width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;box-shadow:0 0 0 3px var(--peach-s),0 3px 0 3px var(--peach-s);transform:rotate(-6deg)}
.slots li:nth-child(2) .slot-em{transform:rotate(5deg);box-shadow:0 0 0 3px var(--pistachio-s),0 3px 0 3px var(--pistachio-s)}
.slots li:nth-child(3) .slot-em{transform:rotate(-3deg);box-shadow:0 0 0 3px var(--blue-s),0 3px 0 3px var(--blue-s)}
.slot-body{display:flex;flex-direction:column;min-width:0}
.slot-meal{font-size:13px;color:var(--muted);font-weight:600}
.slot-title{font-weight:700;font-size:16.5px;line-height:1.2}
.slot-note{display:flex;align-items:center;gap:5px;font-size:13.5px;color:var(--muted);font-weight:600}.slot-note .ic{width:15px;height:15px;color:var(--tomato)}
.slot.leftover .slot-title{font-weight:600}
.slot.empty{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px dashed var(--line)}.slot.empty .slot-meal{width:72px}
.slot-add{display:flex;align-items:center;gap:8px;color:var(--tomato);font-weight:700}.slot-add .ic{width:20px;height:20px}

/* ---------- shop ---------- */
.count{background:var(--card);border-radius:24px;padding:10px 16px;text-align:center;line-height:1;box-shadow:var(--shadow);transform:rotate(3deg);margin-right:36px;margin-bottom:6px}
.count-n{font-size:44px;font-weight:800;color:var(--tomato)}.count-of{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
.meter{height:18px;background:var(--card);border-radius:999px;margin:-4px 0 22px;padding:3px;box-shadow:inset 0 0 0 2px var(--line)}
.meter i{display:block;height:100%;min-width:12px;background:var(--pistachio);border-radius:999px;transition:width .5s var(--pop)}
.aisle{margin-bottom:24px}
.aisle-name{display:flex;justify-content:space-between;align-items:center;font-size:24px;margin:0 6px 10px}
.aisle-name small{font-size:13px;font-weight:700;color:var(--ink);background:var(--pistachio-s);padding:3px 12px;border-radius:999px;font-variation-settings:"wdth" 94}
.items{display:grid;gap:8px}
.item{border-radius:24px;background:var(--card);box-shadow:var(--shadow);transition:background .3s,transform .2s}
.item-btn{display:grid;grid-template-columns:36px 34px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 16px 12px 12px;min-height:68px}
.box{width:36px;height:36px;border-radius:13px;border:3px solid var(--line);display:grid;place-items:center;background:var(--card);transition:all .2s}
.box svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.3) rotate(-30deg);transition:all .3s var(--pop)}
.item-em{font-size:26px;text-align:center;transition:transform .3s var(--pop)}
.item-body{display:flex;flex-direction:column;min-width:0}
.item-name{font-weight:700;font-size:17px;line-height:1.2}
.strike{display:none}
.item-why{font-size:13px;color:var(--muted);font-weight:600}
.item-qty{font-weight:800;font-size:16px;background:var(--bg);border-radius:999px;padding:4px 12px;white-space:nowrap}
.item.got{background:var(--pistachio-s);box-shadow:none}
.item.got .box{background:var(--pistachio);border-color:var(--pistachio)}.item.got .box svg{opacity:1;transform:none}
.item.got .item-name{text-decoration:line-through;text-decoration-thickness:2.5px;text-decoration-color:rgba(59,34,24,.4);color:var(--muted)}
.item.got .item-em{transform:scale(.8) rotate(-8deg);opacity:.7}
.item.pop{animation:squish .45s var(--pop)}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(.95,1.04)}60%{transform:scale(1.03,.97)}100%{transform:scale(1)}}
.addbar{display:flex;gap:10px;margin:6px 0 26px}
.addbar input,.search input{flex:1;min-width:0;height:54px;border-radius:999px;border:0;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--line);padding:0 22px;font:inherit;font-variation-settings:inherit;color:inherit}
.addbar input:focus,.search input:focus{outline:none;box-shadow:inset 0 0 0 3px var(--blue)}
.addbar input::placeholder,.search input::placeholder{color:var(--muted);opacity:.8}
.finish{text-align:center}.finish p{color:var(--muted);font-size:14px;margin-top:12px;font-weight:600}

/* ---------- pantry ---------- */
.tools{display:grid;gap:12px;margin-bottom:22px}
.search{position:relative;display:flex}.search .ic{position:absolute;left:18px;top:17px;width:20px;height:20px;color:var(--muted)}
.search input{padding-left:50px;width:100%}
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px}
.seg-b{flex:none;height:42px;padding:0 18px;border-radius:999px;background:var(--card);font-weight:700;font-size:15px;box-shadow:0 0 0 2px var(--line);transition:all .2s var(--pop)}
.seg-b.on{background:var(--ink);color:var(--bg);box-shadow:none;transform:rotate(-2deg) scale(1.04)}
.seg.wide{margin-bottom:12px}
.shelf{background:var(--card);border-radius:30px;padding:16px 16px 8px;margin-bottom:16px;box-shadow:var(--shadow)}
.shelf-name{display:flex;gap:10px;align-items:center;font-size:24px;margin-bottom:4px}
.shelf-name small{font-size:13px;background:var(--gum-s);padding:2px 12px;border-radius:999px;font-weight:700}
.shelf[data-loc-group=fridge] .shelf-name small{background:var(--blue-s)}.shelf[data-loc-group=pantry] .shelf-name small{background:var(--peach-s)}.shelf[data-loc-group=freezer] .shelf-name small{background:var(--pistachio-s)}
.stock-row{display:flex;align-items:center;gap:12px;min-height:64px;border-top:2px dashed var(--line)}
.stock-em{font-size:24px;width:46px;height:46px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}
.stock-row:nth-child(3n+1) .stock-em{transform:rotate(-5deg)}.stock-row:nth-child(3n+2) .stock-em{transform:rotate(4deg)}
.stock-body{flex:1;display:flex;flex-direction:column;min-width:0}
.stock-name{font-weight:700;line-height:1.2}.stock-note{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onhand{font-size:13px;font-weight:700;background:var(--pistachio-s);border-radius:999px;padding:4px 12px}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border-radius:999px;padding:4px}
.step button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 2px 0 var(--line);transition:transform .15s var(--pop)}
.step button:active{transform:scale(.88)}
.step svg{width:18px;height:18px}
.step b{min-width:66px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.step small{font-weight:600;color:var(--muted);font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-weight:600}.empty-em{font-size:54px}

/* ---------- recipes ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rcard button{display:block;width:100%;background:var(--card);border-radius:30px;padding:8px 8px 14px;box-shadow:var(--shadow);transition:transform .25s var(--pop)}
.rcard button:hover{transform:rotate(-1.2deg) translateY(-2px)}
.rcard:nth-child(even) button:hover{transform:rotate(1.2deg) translateY(-2px)}
.rcard .plate{aspect-ratio:1/1;border-radius:24px}.rcard .plate-em{font-size:clamp(44px,12vw,70px)}
.rcard-body{padding:10px 8px 0}
.rcard h3{font-size:clamp(17px,4.4vw,20px);line-height:1.08;margin-bottom:8px}
.rcard-meta{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.rcard-meta .ic{width:15px;height:15px;color:var(--tomato)}
.rcard-tags{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:600}

/* ---------- recipe sheet ---------- */
#overlay{position:fixed;inset:0;z-index:50;pointer-events:none}#overlay.open{pointer-events:auto}
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;animation:rise .45s var(--pop)}
@keyframes rise{from{transform:translateY(40px) scale(.97);opacity:0}}
.sheet-scroll{flex:1;overflow-y:auto;padding-bottom:120px}
.hero{position:relative;padding:12px 12px 0}
.hero-plate{aspect-ratio:4/3;max-height:44vh;width:100%;border-radius:34px}
.hero .back{position:absolute;left:26px;top:calc(26px + env(safe-area-inset-top))}
.sheet-body{padding:22px 18px 0;max-width:760px;margin:0 auto}
.r-title{font-size:clamp(36px,10vw,54px);line-height:.95;margin-bottom:12px}
.r-meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:15px;flex-wrap:wrap;font-weight:600}.r-meta .ic{width:17px;height:17px;color:var(--tomato)}
.r-desc{margin:14px 0;max-width:60ch;font-size:16.5px;font-weight:500}
.r-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.badge{font-size:13.5px;font-weight:700;padding:5px 13px;border-radius:999px;background:var(--blue-s)}
.badge.ok{background:var(--pistachio);display:inline-flex;align-items:center;gap:6px}.badge .ic{width:15px;height:15px}
.ings{background:var(--card);border-radius:32px;padding:20px 18px 16px;box-shadow:var(--shadow)}
.ings-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
h2{font-size:28px}
.grp{font-size:15px;font-weight:800;background:var(--butter-s);display:inline-block;padding:3px 14px;border-radius:999px;margin:16px 0 4px}
.ing{display:grid;grid-template-columns:34px 82px 1fr 22px;gap:8px;align-items:baseline;padding:11px 0;border-top:2px dashed var(--line);font-size:16.5px}
.ing-list .ing:first-child{border-top:0}
.ing-em{font-size:20px;text-align:center}
.ing-q{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.ing-n small{color:var(--muted);font-size:14px;font-weight:600}
.ing-have{width:20px;height:20px;border-radius:50%;background:var(--pistachio);display:grid;place-items:center;align-self:center}.ing-have svg{width:12px;height:12px;fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.ing.need .ing-have{background:var(--peach-s);color:var(--tomato);font-size:11px}
.ing-legend{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-top:10px;font-weight:600}.ing-legend .ic{width:16px;height:16px;background:var(--pistachio);border-radius:50%;padding:3px;color:var(--ink)}
.method{margin-top:30px}.method h2{margin-bottom:10px}
.steps li{display:grid;grid-template-columns:46px 1fr;gap:12px;padding:12px 0}
.sn{width:42px;height:42px;border-radius:50%;background:var(--tomato);color:#fff;font-weight:800;font-size:19px;display:grid;place-items:center;box-shadow:0 3px 0 var(--tomato-d)}
.steps li:nth-child(3n+2) .sn{background:var(--blue);box-shadow:0 3px 0 #4A55D4}.steps li:nth-child(3n) .sn{background:var(--butter);color:var(--ink);box-shadow:0 3px 0 #D9A91C}
.steps p{max-width:62ch;font-size:16.5px;line-height:1.55;padding-top:7px}
.dur{display:inline-flex;align-items:center;gap:5px;font-style:normal;font-size:13px;font-weight:700;background:var(--butter-s);padding:2px 10px;border-radius:999px;margin-left:6px;white-space:nowrap}.dur .ic{width:14px;height:14px}
.sheet-bar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%);display:flex;justify-content:center}
.sheet-bar .btn{width:100%;max-width:440px}

/* ---------- cook mode ---------- */
.cook{position:absolute;inset:0;background:var(--cook-bg);color:var(--cook-ink);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));animation:rise .45s var(--pop)}
.cook>*{width:100%;max-width:760px;margin-left:auto;margin-right:auto}
.cook-top{display:flex;align-items:center;gap:12px}
.cook-title{flex:1;display:flex;flex-direction:column;text-align:center;min-width:0}
.cook-title b{color:var(--cook-ink);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}.cook-title span{font-size:14px;font-weight:700;opacity:.65}
.cook-prog{display:flex;gap:6px;margin:16px auto 0}
.cook-prog i{flex:1;height:12px;border-radius:99px;background:color-mix(in srgb,var(--cook-ink) 22%,transparent);transition:all .3s var(--pop)}
.cook-prog i.done{background:var(--cook-ink)}.cook-prog i.now{background:var(--tomato);transform:scaleY(1.35)}
.cook-main{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:24px;padding:18px 0}
.cook-text{font-size:clamp(30px,6.6vw,52px);line-height:1.08;font-weight:800;font-variation-settings:"wdth" 84;letter-spacing:-.025em;text-wrap:pretty}
.cook-ings-h{font-size:14px;font-weight:800;margin-bottom:8px;opacity:.7}
.cook-ings ul{display:flex;flex-wrap:wrap;gap:8px}
.cook-ings li{background:var(--card);color:var(--ink);border-radius:999px;padding:7px 16px 7px 8px;font-size:15.5px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 rgba(59,34,24,.12)}
.cook-ings li span{width:30px;height:30px;border-radius:50%;background:var(--butter-s);display:grid;place-items:center;font-size:17px}
.timer{color:var(--ink);align-self:flex-start;display:inline-flex;align-items:center;gap:10px;height:60px;padding:0 28px;border-radius:999px;background:var(--card);font-weight:800;font-size:19px;box-shadow:0 5px 0 rgba(59,34,24,.15);font-variant-numeric:tabular-nums}
.timer .ic{width:24px;height:24px;color:var(--tomato)}.timer.run{background:var(--tomato);color:#fff}.timer.run .ic{color:#fff}
.cook-foot{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.cook-foot .btn.primary{background:var(--cook-ink);color:var(--cook-bg);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.cook .btn:not(.primary),.cook .icon-btn{color:var(--ink)}
.drawer{position:absolute;inset:0;background:rgba(59,34,24,.5);display:flex;align-items:flex-end;justify-content:center;max-width:none!important;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer-in{width:100%;max-width:760px;background:var(--bg);border-radius:34px 34px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;animation:rise .4s var(--pop)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.drawer .ing{grid-template-columns:34px 88px 1fr}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));transform:translate(-50%,24px) scale(.9);background:var(--ink);color:var(--bg);padding:14px 24px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:all .35s var(--pop);z-index:90;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}

/* ---------- tablet + desktop ---------- */
@media(min-width:700px){
  main{max-width:920px;padding:28px 32px}
  .grid{grid-template-columns:repeat(3,1fr);gap:18px}
  .tonight{grid-template-columns:1.1fr 1fr;align-items:center;padding:12px}
  .days{grid-template-columns:repeat(2,1fr)}
  .page-head{padding:34px 36px 28px;min-height:170px}.page-head::after{font-size:128px;right:8px;top:-18px}
}
@media(min-width:900px){
  .shell{padding-bottom:0;padding-left:250px}
  .nav{top:0;left:0;right:auto;bottom:0;width:250px;height:auto;flex-direction:column;padding:28px 18px 24px;border-radius:0 40px 40px 0;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:10px;margin:0 8px 28px}.brand-mark{font-size:34px;transform:rotate(-10deg)}.brand-name{font-size:28px;font-weight:800;font-variation-settings:"wdth" 82;letter-spacing:-.02em}
  .tabs{flex-direction:column;flex:none;gap:6px}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;height:56px;padding:0 18px;font-size:17px;border-radius:22px}
  .tab-ico{width:28px;height:28px}
  #toast{bottom:32px;left:calc(50% + 125px)}
  main{max-width:1120px;padding:36px 48px 80px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .days{grid-template-columns:repeat(3,1fr)}
  .tools{grid-template-columns:1fr auto;align-items:center}.tools .search{max-width:440px}
  .aisles{columns:2;column-gap:28px}.aisle{break-inside:avoid}
  .sheet{left:250px}
  .hero{padding:20px 40px 0}.hero-plate{max-height:360px;aspect-ratio:21/8}.hero .back{left:62px;top:44px}
  .sheet-body{max-width:1100px;padding:30px 40px 0;display:grid;grid-template-columns:minmax(320px,400px) 1fr;column-gap:48px;align-items:start}
  .sheet-main{grid-column:2;grid-row:1}
  .ings{grid-column:1;grid-row:1/3;position:sticky;top:20px}
  .method{grid-column:2;grid-row:2;margin-top:4px}
  .sheet-bar{left:250px}
  .cook{padding:28px 56px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cook-main>:first-child{margin-top:auto}.cook-main>:last-child{margin-bottom:auto}
.mode{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.mode svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.nav-foot{display:block;position:fixed;right:20px;top:calc(22px + env(safe-area-inset-top));z-index:15}
body:has(#overlay.open) .nav-foot{display:none}
@media(min-width:900px){.nav-foot{position:static;margin-top:auto;padding:0 8px}}
</style>
