# Waitlist service for static sites (see docs/host/waitlist.md).
#
#   docker compose -f docker-compose.waitlist.yml up -d --build
#
# Run from the repository root. Needs waitlist/config/waitlist.config.json and
# WAITLIST_SECRET in .env. This stack is separate from the PantryPal stacks, so
# it keeps running when you rebuild them.
#
# It joins the `pantrypal_tunnel` network that docker-compose.tunnel.yml creates,
# so the same cloudflared connector can reach it at http://waitlist:8790. Start
# the tunnel stack first. No port is published.
services:
  waitlist:
    build:
      context: .
      dockerfile: waitlist/Dockerfile
    image: pantrypal-waitlist:prod
    container_name: waitlist
    restart: unless-stopped
    environment:
      WAITLIST_SECRET: ${WAITLIST_SECRET:?Set WAITLIST_SECRET in .env (see .env.example)}
      # Needed only when the config file has an "smtp" block.
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./waitlist/config:/config:ro
      - ./waitlist/data:/data
    networks:
      - tunnel

networks:
  tunnel:
    name: pantrypal_tunnel
    external: true
