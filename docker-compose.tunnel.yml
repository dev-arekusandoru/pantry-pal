# Production stack behind a dashboard-managed Cloudflare Tunnel.
#
# This file is intentionally separate from docker-compose.yml so the local
# stack (published loopback port, shared `rakazo` network) stays untouched:
#
#   docker compose -f docker-compose.tunnel.yml up -d --build
#
# Run from the repository root: the bind mount and `.env` are relative to it.
# Compose auto-loads `.env` for interpolation, and only this file is used when
# invoked with `-f` (docker-compose.override.yml is not merged in). Both secrets
# are required; the `:?` interpolations abort the command before anything starts
# when they are missing.
#
# Public traffic reaches pantrypal only through cloudflared over the private
# `tunnel` network, using the service name `pantrypal:8787`. The app also joins
# the shared `rakazo` network (same name as the local stack), so sibling
# containers on this host — rakazo and homehub — can call it at
# `http://pantrypal:8787` without leaving the box or crossing Cloudflare.
# Browser sessions are not shared, so those clients send a bearer token.
services:
  pantrypal:
    build: .
    image: pantrypal:prod
    restart: unless-stopped
    environment:
      PANTRYPAL_DB_PATH: /data/pantrypal.db
      PORT: "8787"
      HOST: 0.0.0.0
      # Signup for new accounts. Set PANTRYPAL_SIGNUP=closed in .env after you
      # create your accounts.
      PANTRYPAL_SIGNUP: ${PANTRYPAL_SIGNUP:-open}
      # Shows "Contact support" in Settings when set.
      PANTRYPAL_SUPPORT_EMAIL: ${PANTRYPAL_SUPPORT_EMAIL:-}
    volumes:
      # Same host directory as the local stack, so existing data carries over.
      - ./data:/data
    networks:
      - tunnel
      - rakazo

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Remotely managed connector token from the Cloudflare dashboard.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env (see .env.example)}
    depends_on:
      pantrypal:
        condition: service_healthy
    networks:
      - tunnel

  # Off-site backups to Cloudflare R2 (see litestream.yml). Starts only when
  # `.env` sets COMPOSE_PROFILES=backup, so a stack without R2 still runs.
  # Runs as the same user as the app, so the files it writes in data/ keep
  # the app's owner.
  litestream:
    image: litestream/litestream:0.5.17
    profiles: [backup]
    restart: unless-stopped
    user: "1000:1000"
    command: replicate
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      pantrypal:
        condition: service_healthy
    networks:
      - tunnel

networks:
  # Private bridge network owned by this compose project. No `external: true`
  # and no ports: inbound traffic arrives only through the tunnel.
  tunnel:
    name: pantrypal_tunnel
  # Shared network owned by the rakazo stack, where `pantrypal` must also
  # resolve for the rakazo and homehub containers. Must exist before start:
  #   docker network ls | grep -i rakazo
  #   docker network create rakazo_app   # only if missing
  # Override the name with RAKAZO_NETWORK if it differs.
  rakazo:
    name: ${RAKAZO_NETWORK:-rakazo_app}
    external: true
